[package]
name = "rust-apis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit", 
    "RequestMode",
    "Response",
    "ResponseInit",
    "Window",
    "Headers",
    "WorkerGlobalScope"
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.4"

[profile.release]
opt-level = "z"
lto = true
