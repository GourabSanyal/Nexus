[package]
name = "rust-apis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit", 
    "RequestMode",
    "Response",
    "ResponseInit",
    "Window",
    "Headers",
    "WorkerGlobalScope",
    "console"
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.4"
bip39 = "2.2.2"
slip10 = "0.4.3"
ed25519-dalek = "2.2.0"
k256 = "0.13.4"
sha3 = "0.12.0"
hex = "0.4.3"
bs58 = "0.5.1"
bip32 = "0.5.3"

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen-test= "0.3.0"

[profile.release]
opt-level = "z"
lto = true
