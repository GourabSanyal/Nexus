[package]
name = "rust-apis"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-client = "3.0.8"
solana-commitment-config = "3.0.0"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["cors"]}
